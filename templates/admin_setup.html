<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Configurar administración | Avivamiento Mexicano</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" /></head>
<body><main class="page-section"><div class="auth-wrap"><form class="auth-card" method="post"><div class="section-kicker">Primera configuración</div><h1>Crea tu<br /><em>acceso.</em></h1><p class="auth-description">Define las credenciales para administrar los registros del congreso.</p><label>Usuario<input name="username" autocomplete="username" required /></label><label>Contraseña<input type="password" name="password" minlength="8" autocomplete="new-password" required /></label><label>Confirmar contraseña<input type="password" name="confirmation" minlength="8" autocomplete="new-password" required /></label>{% if error %}<p class="flash">{{ error }}</p>{% endif %}<button class="button button-primary" type="submit">Crear acceso ↗</button><a class="text-link" href="{{ url_for('home') }}">Volver al sitio</a></form></div></main></body></html>
